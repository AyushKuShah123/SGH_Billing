<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Shivam Gift House — Billing</title>

<style>
:root{
  color-scheme:dark;
  --bg:#10141b;
  --surface:#171c24;
  --surface2:#202733;
  --text:#f4f7fb;
  --muted:#a8b0bf;
  --border:#303846;
  --accent:#8b7cff;
  --accent2:#2b2550;
  --danger:#d64545;
  --success:#27ae60;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,
  "Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
}

body{
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}

#app{
  min-height:100vh;
  background:var(--bg);
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
  transition:
    transform .08s ease,
    box-shadow .08s ease,
    background .15s ease,
    border-color .15s ease,
    filter .15s ease;
}

button:not(:disabled):active{
  transform:translateY(2px) scale(.97);
  box-shadow:inset 0 3px 7px rgba(0,0,0,.35);
  filter:brightness(.88);
}

button:focus-visible{
  outline:2px solid var(--accent);
  outline-offset:2px;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.top{
  position:sticky;
  top:0;
  z-index:20;
  background:color-mix(in srgb,var(--surface) 94%,transparent);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
  padding:max(12px,env(safe-area-inset-top)) 18px 12px;
}

.topin{
  max-width:1180px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
}

.logo{
  width:40px;
  height:40px;
  border-radius:12px;
  background:var(--accent);
  color:white;
  display:grid;
  place-items:center;
  font-weight:900;
}

.brand h1{
  font-size:16px;
  margin:0;
}

.brand small{
  color:var(--muted);
}

.nav{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.nav button,
.ghost{
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  padding:9px 12px;
  border-radius:10px;
}

.nav button:hover,
.ghost:hover{
  border-color:var(--accent);
}

.nav button.active{
  background:var(--accent2);
  color:var(--accent);
  border-color:var(--accent);
  font-weight:700;
}

.main{
  max-width:1180px;
  margin:auto;
  padding:22px 18px 40px;
}

.pagehead{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:15px;
  margin-bottom:18px;
}

.pagehead h2{
  margin:0 0 5px;
  font-size:26px;
}

.muted{
  color:var(--muted);
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.primary{
  border:0;
  background:var(--accent);
  color:white;
  padding:11px 15px;
  border-radius:10px;
  font-weight:750;
}

.primary:hover{
  filter:brightness(1.08);
}

.danger{
  border:0;
  background:var(--danger);
  color:white;
  padding:9px 12px;
  border-radius:9px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:13px;
}

.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:15px;
  padding:16px;
  box-shadow:0 6px 22px rgba(20,30,50,.04);
}

.metric{
  font-size:25px;
  font-weight:800;
  margin-top:7px;
}

.label{
  font-size:12px;
  color:var(--muted);
  font-weight:700;
  text-transform:uppercase;
  letter-spacing:.04em;
}

.section{
  margin-top:18px;
}

.tablewrap{
  overflow:auto;
  border:1px solid var(--border);
  border-radius:13px;
}

.table{
  width:100%;
  border-collapse:collapse;
  min-width:760px;
}

.table th,
.table td{
  padding:11px 12px;
  border-bottom:1px solid var(--border);
  text-align:left;
}

.table th{
  font-size:12px;
  color:var(--muted);
  background:var(--surface2);
}

.table tr:last-child td{
  border-bottom:0;
}

.table tr:hover td{
  background:color-mix(in srgb,var(--surface2) 55%,transparent);
}

.badge{
  display:inline-flex;
  padding:4px 8px;
  border-radius:99px;
  background:var(--accent2);
  color:var(--accent);
  font-size:12px;
  font-weight:700;
}

.formgrid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
}

.field label{
  display:block;
  font-size:12px;
  font-weight:700;
  color:var(--muted);
  margin-bottom:6px;
}

.field input,
.field select,
.field textarea{
  width:100%;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text);
  border-radius:10px;
  padding:10px 11px;
  outline:none;
}

.field input:focus,
.field select:focus,
.field textarea:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 18%,transparent);
}

.field textarea{
  min-height:72px;
  resize:vertical;
}

.billbox{
  display:grid;
  grid-template-columns:1.35fr .65fr;
  gap:16px;
}

.items{
  margin-top:14px;
}

.items table{
  min-width:720px;
}

.items input{
  width:100%;
  border:0;
  background:transparent;
  color:var(--text);
  outline:none;
  padding:4px;
}

.items .narrow{
  width:90px;
}

.remove{
  border:0;
  background:transparent;
  color:var(--danger);
  font-size:20px;
  border-radius:7px;
}

.remove:hover{
  background:rgba(214,69,69,.12);
}

.totals{
  display:flex;
  justify-content:flex-end;
  margin-top:15px;
}

.totalbox{
  width:min(100%,380px);
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:13px;
  padding:15px;
}

.totalrow{
  display:flex;
  justify-content:space-between;
  padding:6px 0;
}

.grand{
  font-size:21px;
  font-weight:850;
  border-top:1px solid var(--border);
  margin-top:7px;
  padding-top:12px;
}

.word{
  color:var(--muted);
  font-size:13px;
  margin-top:8px;
}

.empty{
  padding:30px;
  text-align:center;
  color:var(--muted);
}

.settings{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.hide{
  display:none!important;
}

.toast{
  position:fixed;
  right:18px;
  bottom:18px;
  background:var(--text);
  color:var(--bg);
  padding:12px 15px;
  border-radius:10px;
  z-index:99;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
  max-width:min(450px,calc(100vw - 36px));
}

.loading{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:30px;
  color:var(--muted);
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--accent);
  animation:pulse 1s infinite alternate;
}

@keyframes pulse{
  from{opacity:.3;transform:scale(.8)}
  to{opacity:1;transform:scale(1.2)}
}

@media(max-width:850px){

  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  .billbox,
  .settings{
    grid-template-columns:1fr;
  }

  .formgrid{
    grid-template-columns:1fr 1fr;
  }

  .pagehead{
    flex-direction:column;
  }

  .nav{
    overflow:auto;
    flex-wrap:nowrap;
    padding-bottom:2px;
  }

  .nav button{
    white-space:nowrap;
  }

  .topin{
    align-items:flex-start;
    flex-direction:column;
  }

  .top{
    position:relative;
  }
}

@media(max-width:560px){

  .main{
    padding:16px 12px 30px;
  }

  .grid{
    grid-template-columns:1fr 1fr;
    gap:9px;
  }

  .card{
    padding:13px;
  }

  .metric{
    font-size:20px;
  }

  .formgrid{
    grid-template-columns:1fr;
  }

  .actions{
    width:100%;
  }

  .actions>*{
    flex:1;
  }

  .brand h1{
    font-size:15px;
  }

  .logo{
    width:36px;
    height:36px;
  }

  .pagehead h2{
    font-size:23px;
  }
}

@media print{

  body{
    background:white;
    color:#111;
  }

  .top,
  .no-print{
    display:none!important;
  }

  .main{
    padding:0;
    max-width:none;
  }

  .card{
    box-shadow:none;
    border:0;
  }
}
</style>
</head>

<body>

<div id="app"></div>

<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const API_URL = '/api/save-bill';

const USERS = {
  admin:{
    password:'admin123',
    role:'ADMIN',
    name:'Admin'
  },

  cashier:{
    password:'cashier123',
    role:'USER',
    name:'Billing User'
  }
};

/*
 * Login remains active for 30 days.
 */
const SESSION_KEY = 'sghBillingSession';
const SESSION_DAYS = 01;

const SETTINGS_KEY = 'sghBillingSettings';

const state = {

  view:'dashboard',

  loggedIn:false,

  role:'',

  user:'',

  currency:'NPR',

  theme:'dark',

  settings:{
    name:'Shivam Gift House',
    gstLabel:'PAN Number',
    gst:'08XXXXXXXX00',
    mobile:'',
    address:'Bardaghat--4, NawalParasi',
    taxLabel:'Tax Rate',
    taxRate:0,
    gstRates:false,
    accent:'#8b7cff'
  },

  bills:[],

  items:[
    {
      p:'',
      q:1,
      u:0
    }
  ],

  customer:{
    name:'',
    phone:'',
    address:''
  },

  payment:'',

  discountType:'amount',

  discount:0,

  todayBills:[],

  todayLoading:false,

  history:{
    mode:'date',
    date:'',
    from:'',
    to:'',
    query:'',
    billNo:'',
    payment:'All',
    results:null,
    loading:false
  }
};


/* =========================================================
   BASIC HELPERS
========================================================= */

function money(n){

  return new Intl.NumberFormat(
    state.currency === 'NPR'
      ? 'en-NP'
      : 'en-IN',
    {
      style:'currency',
      currency:state.currency,
      maximumFractionDigits:2
    }
  ).format(Number(n)||0);

}


function total(b){

  return (b.items||[]).reduce(
    (s,x)=>
      s+
      (Number(x.q)||0)*
      (Number(x.u)||0),
    0
  );

}


function billGrand(b){

  const subtotal = total(b);

  const discount =
    b.discountType === 'percent'
      ? subtotal*(Number(b.discount)||0)/100
      : Number(b.discount)||0;

  const after =
    Math.max(0,subtotal-discount);

  const tax =
    after*(Number(b.taxRate)||0)/100;

  return after+tax;

}


function localToday(){

  const d = new Date();

  const y = d.getFullYear();

  const m = String(
    d.getMonth()+1
  ).padStart(2,'0');

  const day = String(
    d.getDate()
  ).padStart(2,'0');

  return `${y}-${m}-${day}`;

}


function formatDisplayDate(date){

  if(!date) return '';

  const d =
    date instanceof Date
      ? date
      : new Date(date);

  if(isNaN(d.getTime()))
    return String(date);

  return d.toLocaleDateString(
    'en-GB',
    {
      day:'2-digit',
      month:'short',
      year:'numeric'
    }
  );

}


function formatDisplayTime(date){

  if(!date) return '';

  const d =
    date instanceof Date
      ? date
      : new Date(date);

  if(isNaN(d.getTime()))
    return '';

  return d.toLocaleTimeString(
    'en-GB',
    {
      hour:'2-digit',
      minute:'2-digit',
      second:'2-digit'
    }
  );

}


function escapeHtml(v){

  return String(v ?? '')
    .replace(
      /[&<>"']/g,
      c=>({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[c])
    );

}


/* =========================================================
   NUMBER TO WORDS
========================================================= */

function words(n){

  n=Math.round(Number(n)||0);

  if(!n)
    return 'Zero Only';

  const a=[
    '',
    'One',
    'Two',
    'Three',
    'Four',
    'Five',
    'Six',
    'Seven',
    'Eight',
    'Nine',
    'Ten',
    'Eleven',
    'Twelve',
    'Thirteen',
    'Fourteen',
    'Fifteen',
    'Sixteen',
    'Seventeen',
    'Eighteen',
    'Nineteen'
  ];

  const b=[
    '',
    '',
    'Twenty',
    'Thirty',
    'Forty',
    'Fifty',
    'Sixty',
    'Seventy',
    'Eighty',
    'Ninety'
  ];

  function two(x){

    return x<20
      ? a[x]
      : b[Math.floor(x/10)] +
        (x%10?' '+a[x%10]:'');

  }

  function f(x){

    if(x<100)
      return two(x);

    if(x<1000)
      return a[Math.floor(x/100)] +
        ' Hundred' +
        (x%100?' '+two(x%100):'');

    if(x<100000)
      return f(Math.floor(x/1000)) +
        ' Thousand' +
        (x%1000?' '+f(x%1000):'');

    if(x<10000000)
      return f(Math.floor(x/100000)) +
        ' Lakh' +
        (x%100000?' '+f(x%100000):'');

    return f(Math.floor(x/10000000)) +
      ' Crore' +
      (x%10000000?' '+f(x%10000000):'');

  }

  return f(n)+' Only';

}


/* =========================================================
   BILL NUMBER
========================================================= */

function billNo(){

  const d = new Date();

  const yy =
    String(d.getFullYear()).slice(-2);

  /*
   * Current day of month.
   * Example:
   * 02 January => 02A
   * 15 February => 15B
   */
  const day =
    String(d.getDate()).padStart(2,'0');

  const monthLetter =
    String.fromCharCode(
      65+d.getMonth()
    );

  const prefix =
    `SGH-${yy}${day}${monthLetter}`;

  const nums =
    state.bills
      .map(b=>b.id||b.billNo||'')
      .filter(id=>id.startsWith(prefix))
      .map(id=>Number(id.slice(-4))||0);

  return prefix+
    String(
      Math.max(0,...nums)+1
    ).padStart(4,'0');

}


/* =========================================================
   SETTINGS STORAGE
========================================================= */

function loadSettings(){

  try{

    const raw =
      localStorage.getItem(
        SETTINGS_KEY
      );

    if(!raw) return;

    const saved =
      JSON.parse(raw);

    if(saved.settings)
      state.settings={
        ...state.settings,
        ...saved.settings
      };

    if(saved.currency)
      state.currency=saved.currency;

    if(saved.theme)
      state.theme=saved.theme;

  }catch(e){

    console.error(
      'Settings load error',
      e
    );

  }

}


function persistSettings(){

  localStorage.setItem(
    SETTINGS_KEY,
    JSON.stringify({
      settings:state.settings,
      currency:state.currency,
      theme:state.theme
    })
  );

}


/* =========================================================
   LOGIN
========================================================= */

function loginScreen(){

  const app =
    document.querySelector('#app');

  app.innerHTML=`

    <main
      style="
        min-height:100vh;
        display:grid;
        place-items:center;
        padding:20px;
      "
    >

      <section
        class="card"
        style="
          width:min(420px,100%);
          padding:26px;
        "
      >

        <div
          style="
            text-align:center;
            margin-bottom:22px;
          "
        >

          <div
            class="logo"
            style="
              margin:0 auto 12px;
            "
          >
            SG
          </div>

          <h1
            style="
              margin:0;
            "
          >
            ${escapeHtml(state.settings.name)}
          </h1>

          <div
            class="muted"
            style="margin-top:5px"
          >
            Billing System
          </div>

        </div>


        <div class="field">

          <label>Username</label>

          <input
            id="loginUser"
            autocomplete="username"
            placeholder="Username"
          >

        </div>


        <div
          class="field"
          style="margin-top:12px"
        >

          <label>Password</label>

          <input
            id="loginPass"
            type="password"
            autocomplete="current-password"
            placeholder="Password"
            onkeydown="
              if(event.key==='Enter')
                login()
            "
          >

        </div>


        <button
          class="primary"
          style="
            width:100%;
            margin-top:16px;
          "
          onclick="login()"
        >
          Login
        </button>


        <div
          class="muted"
          style="
            font-size:12px;
            margin-top:14px;
            text-align:center;
          "
        >
          Access is based on your assigned role.
        </div>

      </section>

    </main>

  `;

}


function login(){

  const u =
    (
      document.querySelector('#loginUser')
        ?.value ||
      ''
    )
    .trim()
    .toLowerCase();

  const p =
    document.querySelector('#loginPass')
      ?.value || '';

  const account =
    USERS[u];

  if(
    !account ||
    account.password!==p
  ){

    toast(
      'Invalid username or password'
    );

    return;

  }

  state.loggedIn=true;

  state.role=account.role;

  state.user=account.name;

  state.view='dashboard';

  localStorage.setItem(
    SESSION_KEY,
    JSON.stringify({
      username:u,
      role:account.role,
      name:account.name,
      expiresAt:
        Date.now()+
        SESSION_DAYS*
        24*
        60*
        60*
        1000
    })
  );

  render();

}


function logout(){

  state.loggedIn=false;

  state.role='';

  state.user='';

  state.view='dashboard';

  localStorage.removeItem(
    SESSION_KEY
  );

  render();

}


function restoreSession(){

  try{

    const raw =
      localStorage.getItem(
        SESSION_KEY
      );

    if(!raw)
      return;

    const s =
      JSON.parse(raw);

    if(
      !s.expiresAt ||
      Date.now()>=s.expiresAt
    ){

      localStorage.removeItem(
        SESSION_KEY
      );

      return;

    }

    const account =
      USERS[s.username];

    if(
      !account ||
      account.role!==s.role
    ){

      localStorage.removeItem(
        SESSION_KEY
      );

      return;

    }

    state.loggedIn=true;

    state.role=account.role;

    state.user=account.name;

  }catch(e){

    localStorage.removeItem(
      SESSION_KEY
    );

  }

}


/* =========================================================
   MAIN RENDER
========================================================= */

function render(){

  const app =
    document.querySelector('#app');

  document.documentElement
    .style
    .setProperty(
      '--accent',
      state.settings.accent
    );

  document.documentElement
    .style
    .colorScheme =
      state.theme;


  if(
    state.theme==='light'
  ){

    document.documentElement
      .style
      .setProperty(
        '--bg',
        '#f4f7fb'
      );

    document.documentElement
      .style
      .setProperty(
        '--surface',
        '#ffffff'
      );

    document.documentElement
      .style
      .setProperty(
        '--surface2',
        '#f8fafc'
      );

    document.documentElement
      .style
      .setProperty(
        '--text',
        '#172033'
      );

    document.documentElement
      .style
      .setProperty(
        '--muted',
        '#667085'
      );

    document.documentElement
      .style
      .setProperty(
        '--border',
        '#e4e8ef'
      );

    document.documentElement
      .style
      .setProperty(
        '--accent2',
        '#ebe8ff'
      );

  }else{

    document.documentElement
      .style
      .setProperty(
        '--bg',
        '#10141b'
      );

    document.documentElement
      .style
      .setProperty(
        '--surface',
        '#171c24'
      );

    document.documentElement
      .style
      .setProperty(
        '--surface2',
        '#202733'
      );

    document.documentElement
      .style
      .setProperty(
        '--text',
        '#f4f7fb'
      );

    document.documentElement
      .style
      .setProperty(
        '--muted',
        '#a8b0bf'
      );

    document.documentElement
      .style
      .setProperty(
        '--border',
        '#303846'
      );

    document.documentElement
      .style
      .setProperty(
        '--accent2',
        '#2b2550'
      );

  }


  if(!state.loggedIn){

    loginScreen();

    return;

  }


  let nav=[
    'dashboard',
    'new',
    'bills',
    'outstanding'
  ];


  /*
   * Admin navigation is completely
   * omitted for normal users.
   */
  if(state.role==='ADMIN')
    nav.push('settings');


  app.innerHTML=`

    <header class="top">

      <div class="topin">

        <div class="brand">

          <div class="logo">
            SG
          </div>

          <div>

            <h1>
              ${escapeHtml(

function removeItem(i){

  if(state.items.length<=1){

    toast(
      'At least one item is required'
    );

    return;

  }

  state.items.splice(i,1);

  render();

function refreshBillCalculations(){

  const sum =
    state.items.reduce(
      (s,x)=>
        s+
        (Number(x.q)||0)*
        (Number(x.u)||0),
      0
    );


  const discount =
    Number(state.discount)||0;


  const disc =
    state.discountType==='percent'
      ? sum*discount/100
      : discount;


  const after =
    Math.max(
      0,
      sum-disc
    );


  const tax =
    state.settings.taxRate
      ? after*
        state.settings.taxRate/
        100
      : 0;


  const grand =
    after+tax;


  document
    .querySelectorAll('.item-total')
    .forEach(
      (el,i)=>{

        const x =
          state.items[i];

        if(x){

          el.textContent =
            money(
              (Number(x.q)||0)*
              (Number(x.u)||0)
            );

        }

      }
    );


  const s =
    document.querySelector(
      '#bill-subtotal'
    );

  const d =
    document.querySelector(
      '#bill-discount'
    );

  const t =
    document.querySelector(
      '#bill-tax'
    );

  const g =
    document.querySelector(
      '#bill-grand'
    );

  const w =
    document.querySelector(
      '#bill-words'
    );


  if(s)
    s.textContent=money(sum);

  if(d)
    d.textContent='-'+money(disc);

  if(t)
    t.textContent=money(tax);

  if(g)
    g.textContent=money(grand);

  if(w)
    w.textContent=words(grand);

}

/*
 * Today's overview is retrieved using the
 * normal date-search endpoint.
 */
async function loadTodayBills(){

  state.todayLoading=true;

  const box =
    document.querySelector(
      '#todayBillTable'
    );

  if(box){

    box.innerHTML=`
      <div class="loading">
        <span class="dot"></span>
        Loading today's bills...
      </div>
    `;

  }


  try{

    const today =
      localToday();


    const response =
      await fetch(
        API_URL,
        {
          method:'POST',

          headers:{
            'Content-Type':
              'application/json'
          },

          body:JSON.stringify({

            action:'searchBills',

            search:{
              mode:'date',
              date:today,
              fromDate:'',
              toDate:'',
              query:'',
              billNo:'',
              payment:'All'
            }

          })

        }
      );


    const result =
      await response.json();


    if(
      !response.ok ||
      !result.success
    ){

      throw new Error(
        result.error||
        'Unable to load today bills'
      );

    }


    state.todayBills =
      result.bills||[];


    state.todayLoading=false;


    state.bills =
      mergeBills(
        state.bills,
        state.todayBills
      );


    const table =
      document.querySelector(
        '#todayBillTable'
      );

    if(table){

      table.innerHTML =
        todayOverviewTable(
          state.todayBills
        );

    }


    const count =
      document.querySelector(
        '#todayBillCount'
      );

    if(count){

      count.textContent =
        `${state.todayBills.length}
         bill${
           state.todayBills.length===1
             ? ''
             : 's'
         }
         prepared today`;

    }


  }catch(e){

    state.todayLoading=false;

    const box2 =
      document.querySelector(
        '#todayBillTable'
      );

    if(box2){

      box2.innerHTML=`
        <div class="empty">

          Unable to load today's bills:
          ${escapeHtml(e.message)}

        </div>
      `;

    }

    const count =
      document.querySelector(
        '#todayBillCount'
      );

    if(count){

      count.textContent =
        'Unable to load today bills';

    }

  }

}


function todayOverviewTable(bs){

  if(

  ){

    return `
      <div class="loading">
        <span class="dot"></span>
        Loading...
      </div>
    `;

  }


  if(
    !bs ||
    !bs.length
  ){

    return `
      <div class="empty">
        No bills prepared today.
      </div>
    `;

  }


  return `

    <div class="tablewrap">

      <table class="table">

        <tr>

          <th>
            Customer Name
          </th>

          <th>
            Bill Amount
          </th>

          <th>

  h.to =
    document.querySelector(
      '#historyTo'
    )?.value||'';


  h.query =
    (
      document.querySelector(
        '#historyQuery'
      )?.value||
      ''
    )
    .trim();


  h.billNo =
    (
      document.querySelector(
        '#historyBillNo'
      )?.value||
      ''
    )
    .trim();


  h.payment =
    document.querySelector(
      '#historyPayment'
    )?.value||
    'All';


  if(
    mode==='date' &&
    !h.date
  ){

    toast(
      'Please select a date'
    );

    h.loading=false;

    return;

  }


  if(
    mode==='range' &&
    (!h.from||!h.to)
  ){

    toast(
      'Please select both dates'
    );

    h.loading=false;

    return;

  }


  if(
    mode==='range' &&
    h.from>h.to
  ){

    toast(
      'From date cannot be after To date'
    );

    h.loading=false;

    return;

  }


  const btn =
    document.querySelector(
      '#historySearchBtn'
    );


  if(btn){

    btn.disabled=true;

    btn.textContent=
      'Searching...';

  }


  const table =
    document.querySelector(
      '#billtable'
    );


  if(table){

    table.innerHTML=`

      <div class="loading">

        <span class="dot"></span>

        Searching...

      </div>

    `;

  }


  try{

    /*
     * This structure matches the current
     * /api/save-bill endpoint.
     */
    const search={

      mode:mode,

      date:h.date,

      fromDate:h.from,

      toDate:h.to,

      query:h.query,

      billNo:h.billNo,

      payment:h.payment

    };


    const response =
      await fetch(
        API_URL,
        {
          method:'POST',

          headers:{
            'Content-Type':
              'application/json'
          },

          body:JSON.stringify({

            action:'searchBills',

            search:search

          })

        }
      );


    const result =
      await response.json();


    if(
      !response.ok ||
      !result.success
    ){

      throw new Error(
        result.error||
        'Search failed'
      );

    }


    h.results =
      result.bills||[];


    state.bills =
      mergeBills(
        state.bills,
        h.results
      );


    if(table){

      table.innerHTML =
        billTable(
          h.results
        );

    }


    if(
      !h.results.length
    ){

      toast(
        mode==='date'
          ? `No data for ${h.date}`
          : `No data between ${h.from} and ${h.to}`
      );

    }else{

      toast(
        `${h.results.length} bill(s) found`
      );

    }


  }catch(e){

    h.results=[];


    if(table){

      table.innerHTML=`

        <div class="empty">

          Search failed:
          ${escapeHtml(e.message)}

        </div>

      `;

    }


    toast(
      'Search failed: '+
      e.message
    );


  }finally{

    h.loading=false;


    if(btn){

      btn.disabled=false;

      btn.textContent=
        '🔎 Search';

    }

  }

}

/* =========================================================
   MERGE DATA
========================================================= */

function mergeBills(
  existing,
  incoming
){

  const map={};


  (existing||[])
    .forEach(
      b=>{

        const id =
          b.id||
          b.billNo;

        if(id)
          map[id]=b;

      }
    );


  (incoming||[])
    .forEach(
      b=>{

        const id =
          b.id||
          b.billNo;

        if(id)
          map[id]={
            ...map[id],
            ...b
          };

      }
    );


  return Object.values(map);

}

/* =========================================================
   SAVE BILL
========================================================= */

async function saveBill(){

  const now =
    new Date();


  const payment =
    document.querySelector(
      '#paymentMode'
    )?.value||
    state.payment;


  if(!payment){

    toast(
      'Please select a payment mode'
    );

    document.querySelector(
      '#paymentMode'
    )?.focus();

    return;

  }


  const validItems =
    state.items.filter(
      x=>
        String(x.p||'').trim()||
        Number(x.q)>0||
        Number(x.u)>0
    );


  if(!validItems.length){

    toast(
      'Please add at least one item'
    );

    return;

  }


  const sum =
    state.items.reduce(
      (s,x)=>
        s+
        (Number(x.q)||0)*
        (Number(x.u)||0),
      0
    );


  const discount =
    Number(state.discount)||0;


  const disc =
    state.discountType==='percent'
      ? sum*discount/100
      : discount;


  const after =
    Math.max(
      0,
      sum-disc
    );


  const tax =
    state.settings.taxRate
      ? after*
        state.settings.taxRate/
        100
      : 0;


  const grand =
    after+tax;


  const customerName =
    document.querySelector(
      '#cn'
    )?.value.trim()||
    '';


  const customerPhone =
    document.querySelector(
      '#cp'
    )?.value.trim()||
    '';


  const customerAddress =
    document.querySelector(
      '#ca'
    )?.value.trim()||
    '';


  state.customer={
    name:customerName,
    phone:customerPhone,
    address:customerAddress
  };


  const generatedBillNo =
    billNo();


  const b={

    billNo:generatedBillNo,

    id:generatedBillNo,

    date:now.toISOString(),

    customerName:customerName,

    customerPhone:customerPhone,

    customerAddress:customerAddress,

    customer:customerName,

    phone:customerPhone,

    address:customerAddress,

    items:
      JSON.parse(
        JSON.stringify(
          validItems
        )
      ),

    paymentMode:payment,

    payment:payment,

    createdBy:state.user,

    user:state.user,

    discountType:
      state.discountType,

    discount:discount,

    subtotal:sum,

    taxRate:
      state.settings.taxRate,

    taxLabel:
      state.settings.taxLabel,

    taxAmount:tax,

    grandTotal:grand,

    currency:
      state.currency

  };


  const btn =
    document.querySelector(
      '#saveBillBtn'
    );


  if(btn){

    btn.disabled=true;

    btn.textContent=
      'Saving...';

  }


  try{

    const response =
      await fetch(
        API_URL,
        {
          method:'POST',

          headers:{
            'Content-Type':
              'application/json'
          },

          body:JSON.stringify({

            action:'saveBill',

            bill:b

          })

        }
      );


    const result =
      await response.json();


    if(
      !response.ok ||
      !result.success
    ){

      throw new Error(
        result.error||
        'Unable to save bill'
      );

    }


    b.id =
      result.billNo||
      b.id;


    b.billNo=b.id;


    /*
     * Keep local record available
     * immediately after saving.
     */
    state.bills.unshift({
      ...b,
      date:formatDisplayDate(now),
      time:formatDisplayTime(now)
    });


    toast(
      'Bill saved successfully: '+
      b.id
    );


    printBill(
      b.id
    );


    resetBill();


  }catch(error){

    toast(
      'Save failed: '+
      error.message
    );

  }finally{

    if(btn){

      btn.disabled=false;

      btn.textContent=
        'Save & Print';

    }

  }

}

function isTodayBill(b){

  if(!b)
    return false;


  if(b.dateISO){

    const d =
      new Date(b.dateISO);

    if(!isNaN(d.getTime())){

      return (
        d.toISOString()
          .slice(0,10)
        ===
        localToday()
      );

    }

  }


  if(
    typeof b.date==='string'
  ){

    const text =
      b.date.trim();


    if(
      text===
      formatDisplayDate(
        new Date()
      )
    )
      return true;


    const m =
      text.match(
        /^(\d{2})-(\d{2})-(\d{4})$/
      );


    if(m){

      return (
        `${m[3]}-${m[2]}-${m[1]}`
        ===
        localToday()
      );

    }

  }


  return false;

}


/* =========================================================
   THEME / NAVIGATION
========================================================= */

function toggleTheme(){

  state.theme =
    state.theme==='dark'
      ? 'light'
      : 'dark';

  persistSettings();

  render();

}


function go(v){

  if(
    v==='settings' &&
    state.role!=='ADMIN'
  ){

    toast(
      'Admin access required'
    );

    return;

  }

  state.view=v;

  render();

}


/* =========================================================
   TOAST
========================================================= */

function toast(t){

  let el =
    document.querySelector(
      '#toast'
    );


  if(!el){

    const d =
      document.createElement(
        'div'
      );

    d.id='toast';

    document.body.appendChild(d);

    el=d;

  }


  el.innerHTML=
    '<div class="toast">'+
    escapeHtml(t)+
    '</div>';


  setTimeout(
    ()=>{
      if(el)
        el.innerHTML='';
    },
    3000
  );

}


/* =========================================================
   INITIALIZE
========================================================= */

loadSettings();

restoreSession();

state.history.date=
  localToday();

render();

</script>
